name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # scripts/pre-publish.sh optimizes the release module with wasm-opt and runs the
      # contract check + harness against that exact artifact; ubuntu-latest has no binaryen.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Full pre-publish gate
        run: sh scripts/pre-publish.sh
